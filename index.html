<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Premium — Enterprise Finance Workspace</title>
    <style>
        /* --- Design Tokens & CSS Custom Properties --- */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --sidebar-width: 260px;
        }

        body.dark-theme {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1f2937;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        button {
            cursor: pointer;
            font: inherit;
            border: none;
            background: none;
            transition: all 0.2s;
        }

        /* --- Application Layout Shell --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-container {
            padding: 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- Navigation Menu --- */
        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
        }
        .brand-logo span { color: var(--accent-green); }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item button {
            width: 100%;
            padding: 12px 16px;
            text-align: left;
            border-radius: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item.active button, .nav-item button:hover {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        /* --- Utility UI Elements --- */
        .btn-pill {
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
        }
        .btn-primary:hover { filter: brightness(0.95); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .content-panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
        }

        .panel-span-2 { grid-column: span 2; }
        .panel-span-3 { grid-column: span 3; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* --- Core System Modules --- */
        .workspace-view { display: none; }
        .workspace-view.active-view { display: block; }

        /* Module: Ledger Rows */
        .ledger-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .ledger-row:last-child { border-bottom: none; }
        .ledger-meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .amount-neg { color: #ef4444; font-weight: 700; }
        .amount-pos { color: var(--accent-green); font-weight: 700; }

        /* Module: Allocation Allocator Bars */
        .allocation-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bar-container {
            background-color: var(--bg-primary);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .fill-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Module: Compound Engineering Inputs */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
        }

        /* Custom Dynamic Graph Area */
        .visual-graph-frame {
            height: 240px;
            display: flex;
            align-items: flex-end;
            gap: 16px;
            padding-top: 20px;
            border-bottom: 2px solid var(--border-color);
        }
        .graph-column {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .graph-pill-fill {
            width: 100%;
            max-width: 40px;
            background-color: var(--accent-blue);
            border-radius: 6px 6px 0 0;
            transition: height 0.4s ease;
        }

        /* --- Toast Banner Notification --- */
        .toast-banner {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background-color: #0f172a;
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        .toast-banner.visible {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .panel-span-2, .panel-span-3 { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Layout Navigation Sidebar -->
    <aside class="sidebar">
        <div class="brand-logo">ORBIT<span>PREMIUM</span></div>
        <ul class="nav-list">
            <li class="nav-item active" data-target="view-core"><button>📊 Overview Workspace</button></li>
            <li class="nav-item" data-target="view-allocator"><button>💼 Asset Allocator</button></li>
            <li class="nav-item" data-target="view-projections"><button>📈 Growth Modeler</button></li>
        </ul>
    </aside>

    <!-- Main Workspace Container Space -->
    <div class="main-wrapper">
        <header>
            <div id="greeting-string">Welcome back, Executive Workspace</div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-pill" id="theme-toggle">🌙 Dark Mode</button>
                <button class="btn-pill" id="system-reset">↺ Reset Engine</button>
            </div>
        </header>

        <main class="content-container">

            <!-- MODULE 1: GLOBAL DASHBOARD OVERVIEW -->
            <div id="view-core" class="workspace-view active-view">
                <div class="dashboard-grid">
                    <div class="content-panel">
                        <div class="panel-title" style="color: var(--text-secondary); font-size: 14px;">Total Liquid Liquidity</div>
                        <div id="total-liquidity-value" style="font-size: 32px; font-weight: 800; margin: 12px 0;">₺0.00</div>
                        <span style="color: var(--accent-green); font-size: 13px; font-weight: 600;">✓ Accounts synchronized verified</span>
                    </div>
